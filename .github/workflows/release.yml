# 发布：唯一入口是手动触发（Actions → Release → Run workflow，或 gh workflow run release.yml -f tier=patch）。
#
# ⚠ 改本文件后**必须手动 dispatch 实跑一次**：PR 上的 CI 只跑 ci.yml，动 release.yml 的 PR
# 就算绿勾也不代表发布链路验过。理由与 CI 全貌见 docs/PUBLISHING.md 的「CI」节。
#
# 为什么单入口、且不再由 tag 触发：
# - 档位由人按 docs/PUBLISHING.md 的问题链定档（major 必须人类确认），不适合由 commit 类型自动推断。
# - 顺序是全有或全无：先发布成功，才推 main、才建 tag 与 GitHub Release；
#   发布失败时远端零残留，不会留下「有 tag 没版本」的半成品。
# - 手工推 tag 不触发任何发布，避免绕过上面的顺序。
#
# 幂等：重跑不会重复发布 —— 目标版本已在 npm 上时跳过 publish，只补齐 git 侧（提交 / tag / Release）。
#
# 预发布：两个档都用 preid（默认 alpha），产出预发布版本并**发布到 preid 同名 dist-tag**，
# latest 保持不动；GitHub Release 也标为 prerelease。
# - tier=prerelease：在**同一个 X.Y.Z 线**上把预发布计数 +1（2.0.0-alpha.0 → 2.0.0-alpha.1）；
# - tier=premajor：开一条新的 X.Y.Z 预发布线（1.6.3 → 2.0.0-alpha.0）。
# **别拿 premajor 去推同一线上的下一个 alpha**：semver 见 prerelease 不是 [0] 就把 major 加一，
# 从 2.0.0-alpha.0 跑 premajor 得到的是 3.0.0-alpha.0（不可覆盖）。
# **dist-tag 按「结果版本」判、不按 tier 判**：版本号里带 `-` 就发到 <preid>，否则默认 latest。
# 走哪一档按 docs/PUBLISHING.md 定。
#
# 防噪音：bump 之前先跑 scripts/release-guard.mjs —— 上个 tag 以来若只剩非产物改动
# （文档 / 测试 / CI / 工具脚本），说明没有可发布的行为变化，直接红。确需发版用 force 输入越过。
#
# 认证：npm Trusted Publishing（OIDC），全程不传任何 token。
# npm 自 2027-01 起不再接受 bypass-2FA token 直接发布，故不留长期凭据。
name: Release

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'SemVer 档位，按 docs/PUBLISHING.md 的问题链定档'
        type: choice
        required: true
        options: [patch, minor, major, prerelease, premajor]
      preid:
        description: '预发布标识；仅当 tier=prerelease 或 premajor 时使用。版本发到同名 dist-tag，latest 不动'
        type: string
        default: alpha
      force:
        description: '越过「无行为变更不发版」守卫（仅在确需为文档/工具类改动发版时勾选）'
        type: boolean
        default: false

permissions:
  contents: write # 推提交、建 tag 与 GitHub Release
  id-token: write # npm Trusted Publishing 与 provenance 需要 OIDC

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # npm 上的 Trusted Publisher 连接把 Environment name 配成了 github-release，
    # OIDC 声明里的 environment 必须与之一致，否则连接匹配不上。
    environment: github-release
    steps:
      - name: Verify this dispatch came from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::发版只能从 main 触发，当前 ref 是 ${{ github.ref }}"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gh release create --generate-notes 需要完整历史

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: npm

      # 上个 tag 到 HEAD 之间若只剩非产物改动（文档 / 测试 / CI / 工具脚本），
      # 说明没有可发布的行为变化：按 docs/PUBLISHING.md 的 Q0 不该发版。
      # 只判路径；行为等价的内部改动由 Q0 由人回答，确需发版时勾 force。
      - name: Guard against release noise
        if: inputs.force != true
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$base" ]; then
            echo "没有历史 tag：首次发布不受守卫约束。"
            exit 0
          fi
          changed=$(git diff --name-only "$base..HEAD")
          if [ -z "$changed" ]; then
            echo "::error::自 $base 以来没有任何改动，没有可发布的内容。"
            exit 1
          fi
          echo "区间 $base..HEAD 的改动："
          printf '%s\n' "$changed" | node scripts/release-guard.mjs

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # 发布态不变量：dsh.bundle 在、private 没设、engines.dsh 声明了、files 带 cordis.patch.yml。
      - run: npm run check:release

      # bump 前先拦两处版本号漂移：npm version 会同时写两处，漂移只可能来自手工改动。
      - name: Verify the lockfile version matches package.json
        run: |
          pkg=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').version")
          if [ "$pkg" != "$lock" ]; then
            echo "::error::package-lock.json version $lock does not match package.json version $pkg"
            # 这里**不是**叫你在本地 bump：本 workflow 自己 bump（下一步）。
            # 真走到这一步，先在本地把两处对齐（npm version <版本> --no-git-tag-version 会同时写两处）再重跑；
            # 想换版本线，用 workflow 的 tier 输入。
            echo "fix locally so both fields agree (npm version <version> --no-git-tag-version rewrites both), then re-run; use the tier input to pick the next version"
            exit 1
          fi

      - name: Bump both version fields
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "${{ inputs.tier }}" in
            prerelease) version=$(npm version prerelease --preid="${{ inputs.preid }}" --no-git-tag-version) ;;
            premajor) version=$(npm version premajor --preid="${{ inputs.preid }}" --no-git-tag-version) ;;
            *) version=$(npm version "${{ inputs.tier }}" --no-git-tag-version) ;;
          esac
          # dist-tag 从**结果版本**推出来，不留第二处判据：带 `-` 的版本发到 preid 同名 tag，否则走默认 latest。
          case "$version" in
            *-*) tag="${{ inputs.preid }}" ;;
            *) tag="" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "准备发布 $version（dist-tag: ${tag:-默认 latest}）"

      - name: Check whether that version is already on npm
        id: check
        run: |
          if npm view "dsh-zhihu-search@${{ steps.bump.outputs.version }}" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.bump.outputs.version }} 已在 npm 上：跳过 publish，只补齐 git 侧"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the version bump
        run: |
          git add package.json package-lock.json
          git commit -m "chore: release ${{ steps.bump.outputs.version }}"

      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        # 认证靠 OIDC：npm CLI 自行换取短期凭据，全程无 token。缺 id-token: write，
        # 或 npmjs.com 上的 Trusted Publisher 与本 workflow 的仓库 / 文件名 / environment
        # 对不上时，这一步会失败。
        # --provenance 在 OIDC 下是冗余的显式声明，留着当哨兵：环境产不出 provenance 就红。
        # 预发布走独立 dist-tag（如 alpha），latest 留在上一个稳定版：
        # 这一版要求宿主既有 plugins.bundle.config 槽**又有客户端服务 configForms**（两者缺一，配置界面
        # 都不会出现）。光有槽不够：该槽不传 form，表单只能经 configForms.get(<entry id>) 取。
        # 下限见 engines.dsh / peerDependencies，在旧宿主上配置界面静默不出现，
        # 直接推 latest 会让还在旧宿主线上的使用者静默失去配置入口。
        # dist-tag 由 bump 步按**结果版本**给出（预发布 → <preid>，稳定版 → 默认 latest）：
        # 判据只此一处，publish 与 GitHub Release 两步读同一个输出，避免「推 latest 的那一档其实是预发布」。
        run: |
          if [ -n "${{ steps.bump.outputs.dist_tag }}" ]; then
            npm publish --provenance --access public --tag "${{ steps.bump.outputs.dist_tag }}"
          else
            npm publish --provenance --access public
          fi

      # 只在失败时跑：打印 npm 校验 Trusted Publisher 时看到的 OIDC 声明。
      # 环境名不符这类问题实测报的是 404 而非 ENEEDAUTH，没有这份声明就只能猜。
      # 只打印解码后的 claim，不打印 token 本身。
      - name: Dump the OIDC claims npm validates
        if: failure()
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          req = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=npm:registry.npmjs.org",
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          keys = ("aud", "sub", "repository", "repository_owner", "job_workflow_ref", "environment", "ref", "event_name")
          print(json.dumps({k: claims.get(k) for k in keys}, indent=2, ensure_ascii=False))
          PY

      - name: Push the release commit
        run: git push origin HEAD:main

      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 与 publish 同一判据（结果版本带 `-` 即预发布），不按 tier 判。
          extra=""
          if [ -n "${{ steps.bump.outputs.dist_tag }}" ]; then extra="--prerelease"; fi
          gh release create "${{ steps.bump.outputs.version }}" \
            --target "$(git rev-parse HEAD)" \
            --title "${{ steps.bump.outputs.version }}" \
            --generate-notes $extra
